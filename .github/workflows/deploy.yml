name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # フロントエンドのパスや再起動コマンドは環境に合わせて書き換えてください
          script: |
            cd /path/to/frontend
            git pull origin main
            
            # ビルド等が必要な場合はコメントアウトを外してください
            # npm install
            # npm run build
            
            # 再起動コマンド
            # 例: pm2 restart frontend
            # 例: sudo systemctl restart frontend
